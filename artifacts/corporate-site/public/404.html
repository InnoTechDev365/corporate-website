<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Consulting</title>
  <script>
    // SPA redirect for GitHub Pages.
    // Stores the full path in sessionStorage, then redirects to index.html.
    // The base segment count = number of path segments in the repo base path.
    // For username.github.io (root deploy) set to 0.
    // For username.github.io/repo-name set to 1.
    var segmentCount = 1; // Corporate-Website- is one path segment

    var l = window.location;
    var pathSegments = l.pathname.slice(1).split('/');
    var base = pathSegments.slice(0, segmentCount).join('/');
    var remainder = pathSegments.slice(segmentCount).join('/');

    sessionStorage.setItem(
      'spa_redirect',
      (base ? '/' + base : '') +
      '/' + remainder +
      (l.search ? l.search : '') +
      l.hash
    );

    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      (base ? '/' + base : '') + '/'
    );
  </script>
</head>
<body></body>
</html>
