name: Deploy to GitHub Pages

# Repo : https://github.com/InnoTechDev365/corporate-website
# Pages: https://innotechdev365.github.io/corporate-website/

on:
  push:
    branches: [main]
    paths:
      - "artifacts/corporate-site/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/corporate-site/**"
      - "lib/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
